<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 HELIX - Scientific Reasoning Engine</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 48px rgba(0,0,0,0.08);
        }
        h1 { font-size: 32px; color: #0f172a; margin: 0 0 4px 0; }
        .subtitle { color: #64748b; font-size: 16px; margin: 0 0 30px 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; color: #334155; font-size: 14px; margin-bottom: 4px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: #2563eb; }
        .btn {
            background: #2563eb;
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .btn:hover { background: #1d4ed8; }
        .footer { text-align: center; color: #94a3b8; font-size: 13px; margin-top: 30px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .full-width { grid-column: 1 / -1; }
        .example {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: #475569;
            margin-top: 16px;
            border: 1px solid #e2e8f0;
        }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 HELIX</h1>
        <p class="subtitle">Enter scientific evidence for analysis</p>

        <form method="POST" action="/analyze">
            <div class="row">
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="e.g., Alpha-synuclein" required>
                </div>
                <div class="form-group">
                    <label for="relationship">Relationship</label>
                    <input type="text" id="relationship" name="relationship" placeholder="e.g., aggregates in" required>
                </div>
                <div class="form-group">
                    <label for="object">Object</label>
                    <input type="text" id="object" name="object" placeholder="e.g., Lewy bodies" required>
                </div>
                <div class="form-group">
                    <label for="confidence">Confidence (0.0 - 1.0)</label>
                    <input type="number" id="confidence" name="confidence" step="0.01" min="0" max="1" value="0.85">
                </div>
                <div class="form-group">
                    <label for="study_type">Study Type</label>
                    <select id="study_type" name="study_type">
                        <option value="human_study">Human study</option>
                        <option value="clinical_research">Clinical research</option>
                        <option value="animal_study">Animal study</option>
                        <option value="cell_study">Cell study</option>
                        <option value="in_vitro">In vitro</option>
                        <option value="unknown">Unknown</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="evidence_type">Evidence Type</label>
                    <select id="evidence_type" name="evidence_type">
                        <option value="clinical_research">Clinical research</option>
                        <option value="experimental">Experimental</option>
                        <option value="observational">Observational</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="source">Source (PMID, DOI, or citation)</label>
                    <input type="text" id="source" name="source" placeholder="e.g., PMID: 12345678">
                </div>
            </div>
            <button type="submit" class="btn">🧬 Analyze Evidence</button>
        </form>

        <div class="example">
            <strong>💡 Example:</strong>
            Alpha-synuclein <strong>→</strong> aggregates in <strong>→</strong> Lewy bodies
        </div>

        <div class="footer">HELIX Engine v3.0 — Built for clinical research</div>
    </div>
</body>
</html>
