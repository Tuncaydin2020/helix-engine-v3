<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 HELIX - PubMed Import</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 48px rgba(0,0,0,0.08);
        }
        h1 { font-size: 28px; color: #0f172a; }
        .subtitle { color: #64748b; font-size: 16px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; color: #334155; font-size: 14px; margin-bottom: 4px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #2563eb; }
        .btn { background: #2563eb; color: white; font-weight: 600; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn:hover { background: #1d4ed8; }
        .footer { text-align: center; color: #94a3b8; font-size: 13px; margin-top: 30px; }
        .nav-links { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-links a { color: #2563eb; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
        .example { background: #f8fafc; padding: 12px 16px; border-radius: 8px; font-size: 13px; color: #475569; margin-top: 16px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 PubMed Import</h1>
        <p class="subtitle">Search and import research papers from PubMed.</p>

        <div class="nav-links">
            <a href="/">🏠 Dashboard</a>
            <a href="/pubmed">📚 PubMed</a>
            <a href="/pathways">🛤️ Pathways</a>
        </div>

        <form method="POST" action="/pubmed/import">
            <div class="form-group">
                <label for="query">Search Query</label>
                <input type="text" id="query" name="query" placeholder="e.g., Parkinson's disease neuroinflammation" required>
            </div>
            <button type="submit" class="btn">📚 Import from PubMed</button>
        </form>

        <div class="example">
            <strong>💡 Example searches:</strong><br>
            • Parkinson's disease microbiome<br>
            • Alpha-synuclein therapy<br>
            • Neuroinflammation Alzheimer's
        </div>

        <div class="footer">HELIX Engine v3.0 — PubMed Integration</div>
    </div>
</body>
</html>
