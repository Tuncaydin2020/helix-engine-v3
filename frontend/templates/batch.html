<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 HELIX - Batch Analysis</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 48px rgba(0,0,0,0.08);
        }
        h1 { font-size: 28px; color: #0f172a; }
        .subtitle { color: #64748b; font-size: 16px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; color: #334155; font-size: 14px; margin-bottom: 4px; }
        textarea, input[type="file"] { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: #2563eb; }
        .btn { background: #2563eb; color: white; font-weight: 600; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-secondary { background: #f1f5f9; color: #0f172a; }
        .btn-secondary:hover { background: #e2e8f0; }
        .footer { text-align: center; color: #94a3b8; font-size: 13px; margin-top: 30px; }
        .nav-links { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-links a { color: #2563eb; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
        .example { background: #f8fafc; padding: 12px 16px; border-radius: 8px; font-size: 13px; color: #475569; margin-top: 16px; border: 1px solid #e2e8f0; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Batch Analysis</h1>
        <p class="subtitle">Process multiple evidence atoms at once.</p>

        <div class="nav-links">
            <a href="/">🏠 Dashboard</a>
            <a href="/batch">📊 Batch</a>
            <a href="/pubmed">📚 PubMed</a>
            <a href="/pathways">🛤️ Pathways</a>
        </div>

        <form method="POST" action="/batch/process" enctype="multipart/form-data">
            <div class="form-group">
                <label for="batch_data">Enter Evidence (one per line)</label>
                <textarea id="batch_data" name="batch_data" rows="5" placeholder="Subject,Relationship,Object,Confidence,Study Type,Evidence Type,Source&#10;Alpha-synuclein,aggregates in,Lewy bodies,0.85,human_study,clinical_research,PMID:123&#10;Dopamine,causes,motor symptoms,0.90,human_study,clinical_research,PMID:456"></textarea>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>OR Upload a CSV File</label>
                    <input type="file" id="csv_file" name="csv_file" accept=".csv">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end; gap: 10px;">
                    <button type="submit" class="btn">🔬 Analyze Batch</button>
                    <a href="/batch/template" class="btn btn-secondary">📄 Download Template</a>
                </div>
            </div>
        </form>

        <div class="example">
            <strong>💡 CSV Format Example:</strong><br>
            <code>subject,relationship,object,confidence,study_type,evidence_type,source</code>
        </div>

        <div class="footer">HELIX Engine v3.0 — Batch Analysis</div>
    </div>
</body>
</html>
